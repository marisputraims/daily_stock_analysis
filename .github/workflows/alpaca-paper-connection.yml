name: Alpaca Paper Connection Test

on:
  workflow_dispatch:

jobs:
  verify-paper-account:
    name: Verify Alpaca Paper Account
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required secrets
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "${ALPACA_API_KEY:-}" ] || { echo "ERROR: ALPACA_API_KEY is missing"; exit 1; }
          [ -n "${ALPACA_SECRET_KEY:-}" ] || { echo "ERROR: ALPACA_SECRET_KEY is missing"; exit 1; }
          echo "Alpaca paper credentials are configured in GitHub Secrets."

      - name: Read Alpaca paper account
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = "https://paper-api.alpaca.markets/v2/account"
          req = urllib.request.Request(
              url,
              headers={
                  "APCA-API-KEY-ID": os.environ["ALPACA_API_KEY"],
                  "APCA-API-SECRET-KEY": os.environ["ALPACA_SECRET_KEY"],
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  account = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"ERROR: Alpaca paper API returned HTTP {exc.code}")
          except Exception as exc:
              raise SystemExit(f"ERROR: Alpaca paper connection failed: {type(exc).__name__}: {exc}")

          print("Alpaca paper connection: OK")
          print(f"Account status:      {account.get('status')}")
          print(f"Equity:              ${float(account.get('equity', 0)):,.2f}")
          print(f"Cash:                ${float(account.get('cash', 0)):,.2f}")
          print(f"Buying power:        ${float(account.get('buying_power', 0)):,.2f}")
          print(f"Trading blocked:     {account.get('trading_blocked')}")
          print(f"Account blocked:     {account.get('account_blocked')}")
          print(f"Pattern day trader:  {account.get('pattern_day_trader')}")

          if account.get("account_blocked") or account.get("trading_blocked"):
              raise SystemExit("ERROR: Alpaca paper account is blocked for trading")
          PY

      - name: Safety confirmation
        run: |
          echo "Read-only smoke test completed."
          echo "No order endpoint was called and no paper order was submitted."
